name: Main Workflow

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 21.0.6
      uses: actions/setup-java@v1
      with:
        java-version: 21.0.6
    - name: build
      run: make build
    - name: Docker build 🐳
      run: docker build -t java-bank-service .
